# zmk-config/build.yaml

boards:
  nice_nano_v2:   # Your MCU board
    overlays:
      - corne_right.overlay

config:
  # Path to your ZMK config folder
  zmk_config: config

extra_modules:
  - macroboard  # If you have a local module for macros

keymap:
  file: corne.keymap

# Optional: set environment variables for Zephyr SDK (if needed)
env:
  ZEPHYR_TOOLCHAIN_VARIANT: zephyr
  ZEPHYR_SDK_INSTALL_DIR: /opt/zephyr-sdk-0.16.3

# Optional: pick shield to include
# shield: corne_right
